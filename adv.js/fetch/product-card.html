<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }
        .card{
            width: 220px;
            height: 450px;
            align-items: center;
            background: white;
            box-shadow: 0 0 10px black;
            border-radius: 10px;
            overflow: hidden;
            transition: .3s;
        }
        .card img{
            width: 100%;
            height: 200px;
            object-fit: cover;
            cursor: pointer;
        }
        .card p{
            color: black;
            font-weight: bold;
            font-size: 18px;
        }

    </style>
</head>
<body>
    <div class="container"></div>
      <script src="product-card.js"></script>
</body>
</html>
