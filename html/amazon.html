<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="icon" href="amazon-webp.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <h1 >amazon</h1>


      <style>
        input{
            width: 396px;
            padding-left: 4px;
            margin: 4px;
            height: 2.4rem;

        }
        *{
 
            padding: 0;
            margin: 0;
            font-family:system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif ;
        }

        .container{
            text-align: center;
            margin: auto;
            width: 400px;
            padding: 20px;
            box-shadow: 0 0 25px black;
            border-radius: 4rem;


        }

        .login{
            width: 100%; 
            padding: 7px;
            border:none ;
            border-radius:12px ;
            color:black ;
            background-color: rgb(255, 192, 76);
            font-size: 18px;
            margin-top:8px ;
            text-align: center;
        }

         h1{ text-align: center;
            height:4rem ;
            padding: 9px;
            font-size: 40px;
        }


        h2{
            text-align: start;
            font-size: 35px;
        }

        .forgot{
            text-align: end;
        }

        input{

            border: 1px solid blue;
        }

        .signup{

            width: 95%; 
            padding: 7px;
            border:none ;
            border-radius:12px ;
            color:blue;
            background-color: white;
            font-size: 18px;
            margin-top:8px ;
            text-align: center;

        }


      </style>

</head>
<body>
    <div class="container">
        <div>
            <h2>Sign-in</h2> <br>
        </div>

        <div>

        Email(Phone for moblie account) <input type="text">
        </div>

        <div class="forgot">
            <a href="#">Forgot your password?</a>
        </div>
        <div>
         password <br> <input type="password">
        </div>

        <div><br>
            <button class="login">Sign-In</button>
        </div>
        <div><br>
            <br>
            <button class="signup">Create your amazon account</button>
        </div>


    </div>

    
</body>
</html>
