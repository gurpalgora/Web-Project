<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Shopping for Women, Men, Kids Fashion & Lifestyle - Myntra</title>
    <link rel="icon" type="https://cdn.gyftr.com/blog/wp-content/uploads/2025/12/23115658/Myntra-Upcoming-New-Year-Sales-1024x294.png" href="https://avatars.githubusercontent.com/u/3213662?s=280&v=4">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <style>
        *{
            margin: 0;
            padding: 0;
           /* box-sizing: border-box; */
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        
        }
        .navbar{
            display: flex;
            position: fixed;
            width: 100%;
            background-color: white;
            z-index: 1000;
            height: 65px;
            padding: 10px;
            box-shadow: 0 0 4px black;
            gap: 10px;
            align-items: center;
            justify-content: space-around;
        }
        .navbar img{
            height: 70px;
            margin-left: -10px;
            cursor: pointer;
        }
        .b-tn{
            margin-right: 70px;
            overflow: hidden;
            
        }
        .b-tn button{
            padding: 2px;
            margin-inline-start: 20px;
            background-color: white;
            border: none;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 3px solid transparent;
        }

        .input-navbar{
            display: flex;
            border: 1px solid rgb(236, 234, 234);

        }
        .input-navbar input{
            height: 36px;
            outline:none;
            width: 300px;
            background-color:whitesmoke;
            border: 1px solid whitesmoke;
            border-radius: 0px 2px 2px 0px;
            padding-left: 10px;
            
        }
        .input-navbar:focus-within button,
        .input-navbar:focus-within input{
            background-color:rgb(255, 251, 251);
            outline: none;
            border: none;
            border: 1px solid transparent;

              
            

        }
        input::placeholder{
            font-size: 14px;
            color: grey; 
        }
        .input-navbar button{
             background-color:whitesmoke;
            border: 1px solid whitesmoke;
             border-radius: 2px 0px 0px 2px;
             color: grey;
             padding-left: 10px;
        }
        .b-tn button:hover{
            border-bottom:3px solid green;
        }
    
        .btn button{
            margin-inline-start:15px ;
            background-color: white;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: 2px solid transparent;
            
        }
        .mla:hover{
            border-bottom: 2px solid orangered;
        }
        .content img{
            height:58vh;
            width: 1350px;
            background-image: cover;
            padding-top: 86px;
        }
        .im-a img{
            height: 47vh; 
            background-image: cover;
            width: 1250px;
            
        }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="myntra.html">
            <img src="https://avatars.githubusercontent.com/u/3213662?s=280&v=4" alt="">
        </a>
        <div class="b-tn">
            <button>MEN</button>
            <button>WOMEN</button>
            <button>KIDS</button>
            <button>HOME</button>
            <button>BEAUTY</button>
            <button>GENZ</button>
            <button>STUDIO</button>
        </div>
        <div class="input-navbar">
            <button><i class="fa-solid fa-magnifying-glass"></i></button>
            <input placeholder="Search for product,brand and more" type="text">
        </div>
        <div class="btn">
            <button class="mla">Profile</button>
            <button>Wishlist</button>
            <button>Bag</button>
        </div>
    </div>
    <div class="content">
        <img src="https://cdn.gyftr.com/blog/wp-content/uploads/2025/12/23115658/Myntra-Upcoming-New-Year-Sales-1024x294.png" alt="">
    </div>
    <div class="im-a">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSD2VAKAJ75oqH4evy1b8jvCZIp8uzhEtlDyg&s" alt="">
    </div>
</body>
</html>
