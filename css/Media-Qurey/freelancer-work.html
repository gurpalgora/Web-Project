<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="freelancer.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <style>
        @media(min-width: 1024px) {

            .phone,
            .tab {
                display: none;
            }
        }

        @media(min-width:769px) and (max-width:1023px) {

            .lap,
            .phone {
                display: none;
            }
        }

        @media(max-width:768px) {

            .tab,.lap {
                display: none;
            }
        }
     
    </style>
</head>

<body>
    <div class="lap">
        <div class="container">
            <img src="https://www.f-cdn.com/assets/main/en/assets/freelancer-logo-light.svg" alt="">
            <div><button>Hire freelancer</button></div>
            <div><button>Find work</button></div>
            <div><button class="mla">Solution</button></div>
            <div><button>Log in</button></div>
            <div><button>Sign up</button></div>
            <div class="tl-a"><button>Post a Project</button></div>
        </div>

    </div>

    <div class="phone">
        <div class="container">
            <img style="margin-right: 80px;" src="https://www.f-cdn.com/assets/main/en/assets/freelancer-logo-light.svg" alt="">
            <div><button>Log in</button></div>
            <div class="bars"><i class="fa-solid fa-bars"></i></div>
        </div>

    </div>

    <div class="tab">
        <div class="container">
            <img style="margin-right: 340px;" src="https://www.f-cdn.com/assets/main/en/assets/freelancer-logo-light.svg" alt="">
             <div><button>Sign up</button></div>
              <div class="tl-a"><button>Post a Project</button></div>
            <div class="bars"><i class="fa-solid fa-bars"></i></div>
        </div>

    </div>
</body>

</html>
