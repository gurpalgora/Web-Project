<html>
    <head>
        <title></title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
        <style> 
    *{
        margin: 0;
        padding: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    }
            .container{
                display: flex;
                gap: 20px;
                padding: 20px;
                box-shadow: 0 0 10px black;
                align-items: center;
            }
            .container img {
                height: 20px;
            }
            .ml-a{
                margin-left: auto;
            }

            .inp-container{
                display: flex;
            }
            .inp-container input{
                width: 500px;
                height: 2.8rem;
                border-radius: 25px 0px 0px 25px;
                padding-left: 10px;
                border: 1px solid gray;
            }
            
            .inp-container button{
                padding: 10px 15px;
                border: 1px solid gray;
                border-left: none;
                border-radius: 0px 25px 25px 0px;
            }


            .mic{
                border-radius: 50%;
                padding: 15px;
                border: 1px solid gray;
            }

            .sign-in{
                color: blue;
                border: 1px solid gray;
                padding: 10px 20px;
                border-radius: 20px;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div><i class="fa-bars fa-solid"></i></div>
            <div><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTnsGiPB4JytyETefvvKpp2TXH1VI6BpoBIAA&s" alt=""></div>
            <div class="ml-a inp-container">
                <input type="text" placeholder="Search">
                <button ><i class="fa-search fa-solid"></i></button>
            </div>
            <div>
                <button class="mic">
                    <i class="fa-solid fa-microphone"></i>
                </button>
                </div>
            <div class="ml-a"><i class="fa-solid fa-ellipsis-vertical"></i></div>
            <div>
                <button class="sign-in">Sign in</button>
            </div>
        </div>
    </body>
</html>
