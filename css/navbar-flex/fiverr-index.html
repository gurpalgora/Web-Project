<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
        
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

    <style>
        *{
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }

        .container{
            padding:20px;
            display: flex;
            gap: 20px;
            font-weight: 700;
            font-size: 17px;
            box-shadow: 0 0 10px black;
            color: rgb(73,73,73);
            align-items: center;
            
        }

        .container img {
            margin-right: auto;
            height:45px;
        }

        .button-btn{
            border: 1px solid black;
            background-color: white;
            color: black;
            font-weight: 700;
            font-size: 17px;
            border-radius: 4px;
            padding:10px 20px;

        }


        .button-btn:hover{
            background-color: rgb(59, 52, 52);
            color: white;
        }



    </style>
</head>

<body>
    <div class="container">
        <img src="https://1000logos.net/wp-content/uploads/2021/11/Fiverr-Logo.png" alt="">
        <div>Fiverr pro<i class="fa-solid fa-angle-down"></i></div>
        <div>Explore<i class="fa-solid fa-angle-down"></i></div>
        <div><i class="fa-solid fa-earth-asia"></i>En</div>
        <div>Become a Seller</div>
        <div>Sign In</div>
        <div><button class="button-btn">Join </button></div>

    </div>
</body>

</html>
