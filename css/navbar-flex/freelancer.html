<!DOCTYPE html>
  <html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: flex;
            justify-content: space-around;
            background-color: rgb(0,0,0,0.8);
            color: white;
            box-shadow: 0 0 10px black;
            padding: 10px;
            align-items: center;
            gap: 0px;
            height: 60px;

        }
        .container img{
            height: 30px;
        }
        .container button{
            background-color: rgb(0,0,0,0.0);
            color: white;
            border: none;
            font-size: 17px;
            font-weight: 540;
        }
        .mla{
            margin-right:200px;
        }
        .tl-a{
            background-color:#e60278 ;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 4px;
        }


    </style>
</head>
<body>
    <div class="container">
        <img src="https://www.f-cdn.com/assets/main/en/assets/freelancer-logo-light.svg" alt="">
        <div><button>Hire freelancer</button></div>
         <div><button>Find work</button></div>
         <div><button class="mla">Solution</button></div>
         <div><button>Log in</button></div>
          <div><button >Sign up</button></div>
          <div class="tl-a"><button>Post a Project</button></div>  
    </div>
        
  </body>
  </html>
