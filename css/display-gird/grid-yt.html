<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: grid;
            grid-template-columns: repeat(7,1fr);
            grid-template-rows: 23vh 23vh 23vh 23vh;
            background-color: white;
            /* align-items: center; */
            /* column-gap: 20px; */
            gap: 11px;
        }
        div{
            background-color: rgb(26, 180, 26);
        }
       
    </style>
</head>
<body>
    <div class="container">
        <div style="grid-column: 1 / 8;" class="navbar">navbar</div>
        <div style="grid-row: 2 / 4;" class="sidebar">sidebar</div>
        <div style="grid-column: 2 /8;" class="content">content</div>
        <div style="grid-column: 2/ 5;" class="content-a">content-a</div>
        <div style="grid-column: 5/ 8;" class="content-b">content-b</div>
        <div style="grid-column: 1/ 8;" class="footar">footar</div>
    </div>
</body>
</html>
